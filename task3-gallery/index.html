<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 3 - Featured Book Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="gallery-wrapper">
    <h2>Featured Book Covers</h2>
    <div class="gallery">
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=500" alt="Book 1">
        <div class="overlay"><span>Great Expectations</span></div>
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1512820790803-83ca734da794?w=500" alt="Book 2">
        <div class="overlay"><span>To Kill a Mockingbird</span></div>
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=500&auto=format&fit=crop" alt="The Great Gatsby">
        <div class="overlay"><span>The Great Gatsby</span></div>
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1497633762265-9d179a990aa6?w=500" alt="Book 4">
        <div class="overlay"><span>Atomic Habits</span></div>
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=500" alt="Book 5">
        <div class="overlay"><span>Sherlock Holmes</span></div>
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?w=500" alt="Book 6">
        <div class="overlay"><span>The Hobbit</span></div>
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1495446815901-a7297e633e8d?w=500" alt="Book 7">
        <div class="overlay"><span>1984 by George Orwell</span></div>
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?w=500" alt="Book 8">
        <div class="overlay"><span>The Little Prince</span></div>
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1476275466078-4007374efbbe?w=500" alt="Book 9">
        <div class="overlay"><span>The Alchemist</span></div>
      </div>
    </div>
  </div>

</body>
</html>
